<html lang="en">

<style>
  :root{
    --navy:#1B2340;
    --navy-light:#2A3459;
    --paper:#FAF7EF;
    --paper-alt:#F0EADA;
    --line:#DCD3BC;
    --brass:#AD7C2B;
    --brass-light:#D9A94C;
    --ink:#241F14;
    --muted:#7A7362;
    --wa:#1F9E56;
    --wa-dark:#177A43;
    --due:#A8432B;
    --good:#2F6E49;
    --card:#FFFFFF;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-bottom:calc(74px + env(safe-area-inset-bottom));
    min-height:100vh;
  }
  .mono{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;}
  .app-header{
    background:var(--navy);
    color:#EDE7D6;
    padding:calc(18px + env(safe-area-inset-top)) 18px 16px;
    position:relative;
    overflow:hidden;
  }
  .app-header::after{
    content:"";
    position:absolute; left:0; right:0; bottom:0; height:14px;
    background-image:repeating-linear-gradient(to bottom, transparent 0 5px, rgba(237,231,214,0.08) 5px 6px);
  }
  .brand{
    display:flex; align-items:baseline; justify-content:space-between; gap:8px;
  }
  .brand h1{
    font-family:'Fraunces',serif; font-weight:600; font-size:24px; margin:0;
    letter-spacing:0.2px;
  }
  .brand h1 span{ color:var(--brass-light); }
  .brand .tag{ font-size:11px; color:#B9B2A0; text-transform:uppercase; letter-spacing:1.5px; margin-top:2px;}
  .month-switch{
    margin-top:16px; display:flex; align-items:center; justify-content:space-between;
    background:var(--navy-light); border-radius:12px; padding:8px 6px;
  }
  .month-switch button{
    background:none; border:none; color:#EDE7D6; font-size:20px; padding:6px 14px; cursor:pointer; border-radius:8px;
  }
  .month-switch button:active{ background:rgba(255,255,255,0.08); }
  .month-label{ font-family:'Fraunces',serif; font-weight:600; font-size:17px; text-align:center; flex:1; }
  .month-sub{ font-size:10.5px; color:var(--brass-light); text-align:center; letter-spacing:0.5px; margin-top:1px;}

  #app-content{ padding:16px 16px 8px; max-width:640px; margin:0 auto; }

  .install-banner{
    background:var(--paper-alt); border:1px solid var(--line); border-radius:12px;
    padding:12px 14px; font-size:13px; color:var(--muted); margin-bottom:14px;
    display:flex; gap:10px; align-items:flex-start; line-height:1.45;
  }
  .install-banner b{ color:var(--ink); }
  .install-banner button{
    border:none; background:transparent; color:var(--brass); font-weight:600; font-size:12px;
    margin-left:auto; padding:2px 4px; cursor:pointer; white-space:nowrap;
  }

  .stat-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:16px; }
  .stat-card{
    background:var(--card); border-radius:var(--radius); padding:14px 14px 12px;
    border:1px solid var(--line);
  }
  .stat-card .label{ font-size:11px; text-transform:uppercase; letter-spacing:0.6px; color:var(--muted); }
  .stat-card .value{ font-family:'Fraunces',serif; font-size:22px; font-weight:600; margin-top:4px; }
  .stat-card.due .value{ color:var(--due); }
  .stat-card.paid .value{ color:var(--good); }

  .section-title{
    font-family:'Fraunces',serif; font-weight:600; font-size:16px; margin:18px 0 10px;
    display:flex; align-items:center; justify-content:space-between;
  }
  .section-title .count{ font-size:12px; color:var(--muted); font-weight:400; font-family:'Inter',sans-serif;}

  .tenant-card{
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    padding:14px; margin-bottom:12px;
  }
  .tenant-card .row1{ display:flex; justify-content:space-between; align-items:flex-start; gap:8px; }
  .tenant-card .who{ display:flex; flex-direction:column; }
  .tenant-card .room{ font-size:11px; letter-spacing:0.5px; color:var(--brass); font-weight:600; text-transform:uppercase; }
  .tenant-card .name{ font-family:'Fraunces',serif; font-size:17px; font-weight:600; margin-top:1px; }
  .status-pill{
    font-size:10.5px; padding:4px 9px; border-radius:99px; font-weight:600; letter-spacing:0.3px;
    white-space:nowrap;
  }
  .status-pill.due{ background:#F7E3DB; color:var(--due); }
  .status-pill.paid{ background:#DEEEE3; color:var(--good); }

  .grid-inputs{ display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:12px; }
  .field{ display:flex; flex-direction:column; gap:3px; }
  .field label{ font-size:10.5px; color:var(--muted); text-transform:uppercase; letter-spacing:0.4px; }
  .field input{
    border:1px solid var(--line); border-radius:8px; padding:8px 9px; font-size:14px;
    background:var(--paper); font-family:'IBM Plex Mono',monospace; color:var(--ink);
    width:100%;
  }
  .field input:focus{ outline:2px solid var(--brass-light); outline-offset:0; background:#fff;}

  .breakdown{
    margin-top:12px; padding-top:10px; border-top:1px dashed var(--line);
    font-size:12.5px; color:var(--muted); display:flex; flex-wrap:wrap; gap:6px 14px;
  }
  .breakdown b{ color:var(--ink); }

  .totals-row{
    display:flex; justify-content:space-between; align-items:baseline; margin-top:10px;
    padding-top:10px; border-top:1px solid var(--line);
  }
  .totals-row .tlabel{ font-size:12px; color:var(--muted); }
  .totals-row .tval{ font-family:'Fraunces',serif; font-size:20px; font-weight:700; }
  .totals-row .tval.due{ color:var(--due); }
  .totals-row .tval.paid{ color:var(--good); }

  .card-actions{ display:flex; gap:8px; margin-top:12px; }
  .btn{
    flex:1; border:none; border-radius:10px; padding:10px 8px; font-size:13px; font-weight:600;
    cursor:pointer; display:flex; align-items:center; justify-content:center; gap:6px;
  }
  .btn-wa{ background:var(--wa); color:#fff; }
  .btn-wa:active{ background:var(--wa-dark); }
  .btn-ghost{ background:var(--paper-alt); color:var(--ink); border:1px solid var(--line); }
  .btn-ghost:active{ background:var(--line); }
  .btn-mark{ background:var(--navy); color:#EDE7D6; }

  .empty{
    text-align:center; color:var(--muted); font-size:13.5px; padding:30px 20px;
    background:var(--card); border-radius:var(--radius); border:1px dashed var(--line);
  }

  /* Tenants tab */
  .tenant-row{
    background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px;
    margin-bottom:10px;
  }
  .tenant-row .grid-inputs{ grid-template-columns:1fr 1fr; }
  .tenant-row .toprow{ display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;}
  .toggle{
    display:flex; align-items:center; gap:6px; font-size:11.5px; color:var(--muted); cursor:pointer;
  }
  .toggle input{ accent-color:var(--brass); }
  .remove-x{
    background:none; border:none; color:var(--due); font-size:12px; cursor:pointer; font-weight:600;
  }
  .add-btn{
    width:100%; padding:12px; border-radius:12px; border:1.5px dashed var(--brass);
    background:none; color:var(--brass); font-weight:600; font-size:14px; cursor:pointer; margin-top:4px;
  }

  /* Message tab */
  .msg-block{ background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:14px; margin-bottom:16px; }
  .msg-block h3{ font-family:'Fraunces',serif; font-size:15.5px; margin:0 0 4px; }
  .msg-block p.hint{ font-size:12px; color:var(--muted); margin:0 0 10px; line-height:1.5;}
  .msg-block textarea{
    width:100%; min-height:150px; border:1px solid var(--line); border-radius:10px; padding:10px;
    font-family:'IBM Plex Mono',monospace; font-size:13px; resize:vertical; background:var(--paper); color:var(--ink);
  }
  .placeholders{ display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; }
  .chip{
    font-size:11px; background:var(--paper-alt); border:1px solid var(--line); color:var(--brass);
    padding:4px 8px; border-radius:99px; font-family:'IBM Plex Mono',monospace; cursor:pointer;
  }
  .preview{
    margin-top:12px; background:var(--paper-alt); border-radius:10px; padding:10px 12px;
    font-size:12.5px; white-space:pre-wrap; color:var(--ink); line-height:1.5; border:1px solid var(--line);
  }
  .preview-label{ font-size:10.5px; text-transform:uppercase; letter-spacing:0.5px; color:var(--muted); margin-bottom:6px;}

  /* Bottom nav */
  .tabbar{
    position:fixed; left:0; right:0; bottom:0; background:var(--navy);
    display:flex; padding:8px 6px calc(8px + env(safe-area-inset-bottom));
    border-top:1px solid rgba(255,255,255,0.06);
    z-index:20;
  }
  .tabbar button{
    flex:1; background:none; border:none; color:#9C96A6; padding:6px 2px; cursor:pointer;
    display:flex; flex-direction:column; align-items:center; gap:3px; font-size:10.5px; font-weight:600;
    letter-spacing:0.2px;
  }
  .tabbar button.active{ color:var(--brass-light); }
  .tabbar svg{ width:20px; height:20px; }

  .month-summary-bar{
    display:flex; justify-content:space-between; font-size:11.5px; color:var(--muted);
    background:var(--paper-alt); border-radius:10px; padding:8px 12px; margin-bottom:14px;
  }
  .month-summary-bar b{ color:var(--ink); }

  .new-month-btn{
    width:100%; padding:13px; border-radius:12px; border:none; background:var(--brass);
    color:#fff; font-weight:600; font-size:14px; cursor:pointer; margin-top:6px; margin-bottom:6px;
  }

  .toast{
    position:fixed; bottom:90px; left:50%; transform:translateX(-50%);
    background:var(--navy); color:#EDE7D6; padding:10px 16px; border-radius:99px; font-size:12.5px;
    z-index:30; opacity:0; pointer-events:none; transition:opacity .25s ease;
  }
  .toast.show{ opacity:1; }
</style>
</head>
<body>

<div class="app-header">

<script>
const STORAGE_KEY = 'kiraya-book-v1';
let state = null;

const MONTH_NAMES = ['January','February','March','April','May','June','July','August','September','October','November','December'];

function monthKey(y,m){ return y + '-' + String(m).padStart(2,'0'); }
function monthLabel(key){
  const [y,m] = key.split('-').map(Number);
  return MONTH_NAMES[m-1] + ' ' + y;
}
function shiftMonth(key, delta){
  let [y,m] = key.split('-').map(Number);
  m += delta;
  while(m>12){ m-=12; y++; }
  while(m<1){ m+=12; y--; }
  return monthKey(y,m);
}
function uid(){ return 't' + Math.random().toString(36).slice(2,9); }

function sortByRoom(list){
  return list.slice().sort((a,b)=> a.room.localeCompare(b.room, undefined, {numeric:true, sensitivity:'base'}));
}

  ];
}

function defaultAugRecords(){
  // Seeded from the user's Aug 2026 sheet: [tenantId, current, last, sweeper, water, balancePrev]
  const rows = [
    ['r001',8263,8144,130,40,68],

  return {

    activeMonth: '2026-08',
    ui: { tab:'dashboard', bannerDismissed:false },

function migratePhoneBook(){
  let changed = false;
  state.tenants.forEach(t=>{
    const entry = PHONE_BOOK[t.id];
    if(!entry) return;
    if(!t.phone && entry.phone){ t.phone = entry.phone; changed = true; }
    if(t.phone==='94643507629'){ t.phone = '9643507629'; changed = true; } // fix known typo
    if(t.phone2===undefined) t.phone2 = '';
    if(!t.phone2 && entry.phone2){ t.phone2 = entry.phone2; changed = true; }
  });
  if(changed) saveState();
}

async function loadState(){
  try{
    const r = await window.storage.get(STORAGE_KEY);
    state = r && r.value ? JSON.parse(r.value) : defaultState();
  }catch(e){
    state = defaultState();
  }
  if(!state.ui) state.ui = {tab:'dashboard', bannerDismissed:false};
  if(!state.settings) state.settings = { dueDay: 10, lateFeeAmount: 100 };
  if(state.templates && !state.templates.late){
    state.templates.late = "Hi {name} 🙏\nThis is regarding Room {room} — {month} rent.\n\n*Total Due (incl. late charge): ₹{due}*\n(Rent was due by the {dueDay}th; a late charge of ₹{lateFeeAmount} has been added.)\n\nPlease clear this at the earliest to avoid further charges. Thank you.";
  }
  if(state.templates && state.templates.reminder === "Hi {name} 🙏\nRent reminder for Room {room} — {month}.\n\nBasic Rent: ₹{rent}\nElectricity: ₹{electricity}\nSweeper: ₹{sweeper}\nWater: ₹{water}\nPrevious balance: ₹{balancePrev}\n*Total Due: ₹{total}*\n\nPlease pay by the {dueDay}th to avoid a late charge of ₹{lateFeeAmount}. Kindly pay at your earliest convenience. Thank you!"){
    state.templates.reminder = "Hi {name} 🙏\nRent reminder for Room {room} — {month}.\n\nBasic Rent: ₹{rent}\nElectricity: ₹{electricity}\nSweeper: ₹{sweeper}\nWater: ₹{water}\nPrevious balance: ₹{balancePrev}\n*Total Due: ₹{total}*\n\nKindly pay at your earliest convenience, before due date {dueDay}th {month} to avoid late charges. Thank you!";
  }
  if(!state.months[state.activeMonth]) {
    const keys = Object.keys(state.months).sort();
    state.activeMonth = keys.length ? keys[keys.length-1] : '2026-08';
  }
  migratePhoneBook();
  render();
}

let saveTimer=null;
function saveState(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async ()=>{
    try{ await window.storage.set(STORAGE_KEY, JSON.stringify(state)); }
    catch(e){ console.error('save failed', e); }
  }, 300);
}

function tenantById(id){ return state.tenants.find(t=>t.id===id); }

function ensureMonth(key){
  if(state.months[key]) return state.months[key];
  const prevKey = shiftMonth(key, -1);
  const prev = state.months[prevKey];
  const records = {};
  state.tenants.filter(t=>t.active).forEach(t=>{
    const prevRec = prev ? prev.records[t.id] : null;
    const prevComputed = prevRec ? computeRecord(prevRec, t, prevKey) : null;
    records[t.id] = {
      currentReading: prevRec ? prevRec.currentReading : 0,
      lastReading: prevRec ? prevRec.currentReading : 0,
      factor: 8,
      sweeper: prevRec ? prevRec.sweeper : 130,
      water: prevRec ? prevRec.water : 0,
      balancePrev: prevComputed ? prevComputed.due : 0,
      rentPaid: 0
    };
  });
  state.months[key] = { records };
  return state.months[key];
}

function isPastDueDate(monthKey, dueDay){
  const [y,m] = monthKey.split('-').map(Number);
  const dueDate = new Date(y, m-1, dueDay, 23, 59, 59);
  return new Date() > dueDate;
}

function computeRecord(rec, tenant, monthKey){
  monthKey = monthKey || state.activeMonth;
  const reading = Math.max(0, (rec.currentReading||0) - (rec.lastReading||0));
  const electricity = reading * (rec.factor||8);
  const total = (tenant.basicRent||0) + electricity + (rec.sweeper||0) + (rec.water||0) + (rec.balancePrev||0);
  const outstanding = Math.max(0, total - (rec.rentPaid||0));
  const dueDay = (state.settings && state.settings.dueDay) || 10;
  const lateFeeAmount = (state.settings && state.settings.lateFeeAmount) || 0;
  let lateFeeApplied = 0;
  if(outstanding > 0 && lateFeeAmount > 0 && isPastDueDate(monthKey, dueDay)){
    lateFeeApplied = lateFeeAmount;
  }
  const due = outstanding + lateFeeApplied;
  return { reading, electricity, total, due, lateFeeApplied, isLate: lateFeeApplied>0 };
}

function fmt(n){ return '₹' + Math.round(n).toLocaleString('en-IN'); }

function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'), 1800);
}

function fillTemplate(tpl, tenant, rec, computed){
  const map = {
    name: tenant.name,
    room: tenant.room,
    month: monthLabel(state.activeMonth),
    rent: tenant.basicRent,
    electricity: computed.electricity,
    sweeper: rec.sweeper||0,
    water: rec.water||0,
    balancePrev: rec.balancePrev||0,
    total: computed.total,
    paid: rec.rentPaid||0,
    due: computed.due,
    balanceNext: computed.due,
    dueDay: (state.settings && state.settings.dueDay) || 10,
    lateFeeAmount: (state.settings && state.settings.lateFeeAmount) || 0,
    lateFee: computed.lateFeeApplied || 0
  };
  return tpl.replace(/\{(\w+)\}/g, (m,k)=> (k in map) ? map[k] : m);
}

function normalizePhone(phone){
  let d = (phone||'').replace(/\D/g,'');
  if(!d) return '';
  if(d.length===10) d = '91' + d; // default India country code
  return d;
}

function sendWhatsApp(tenantId, kind){
  const t = tenantById(tenantId);
  const rec = state.months[state.activeMonth].records[tenantId];
  const computed = computeRecord(rec, t);
  const phone = normalizePhone(t.phone);
  if(!phone){
    toast('Add a phone number for ' + t.name + ' first');
    switchTab('tenants');
    return;
  }
  const tpl = kind==='reminder' ? state.templates.reminder : kind==='late' ? state.templates.late : state.templates.receipt;
  const text = fillTemplate(tpl, t, rec, computed);
  const url = 'https://wa.me/' + phone + '?text=' + encodeURIComponent(text);
  window.open(url, '_blank');
}

function switchTab(tab){
  state.ui.tab = tab;
  render();
}

function updateField(tenantId, field, value){
  const rec = state.months[state.activeMonth].records[tenantId];
  if(field==='rentPaid' || field==='currentReading' || field==='sweeper' || field==='water'){
    rec[field] = value === '' ? 0 : Number(value);
  }
  saveState();
  if(field==='water'){ render(); } else { refreshCard(tenantId); }
}

function refreshCard(tenantId){
  const t = tenantById(tenantId);
  const rec = state.months[state.activeMonth].records[tenantId];
  const c = computeRecord(rec, t);
  const elecEl = document.getElementById('elec-'+tenantId);
  const totalEl = document.getElementById('total-'+tenantId);
  const dueEl = document.getElementById('due-'+tenantId);
  const pillEl = document.getElementById('pill-'+tenantId);
  if(elecEl) elecEl.textContent = fmt(c.electricity);
  if(totalEl) totalEl.textContent = fmt(c.total);
  if(dueEl){
    dueEl.textContent = c.due>0 ? fmt(c.due) : 'Paid in full';
    dueEl.className = 'tval ' + (c.due>0 ? 'due' : 'paid');
  }
  if(pillEl){
    pillEl.textContent = c.isLate ? 'Late' : (c.due>0 ? 'Due' : 'Paid');
    pillEl.className = 'status-pill ' + (c.due>0 ? 'due':'paid');
  }
}

function markPaid(tenantId){
  const t = tenantById(tenantId);
  const rec = state.months[state.activeMonth].records[tenantId];
  const c = computeRecord(rec, t);
  rec.rentPaid = c.total + c.lateFeeApplied;
  saveState();
  render();
}

/* ---------- Rendering ---------- */

function render(){
  document.querySelectorAll('.tabbar button').forEach(b=>{
    b.classList.toggle('active', b.dataset.tab===state.ui.tab);
  });
  document.getElementById('monthLabel').textContent = monthLabel(state.activeMonth);
  const isCurrent = state.months[state.activeMonth];
  document.getElementById('monthSub').textContent = isCurrent ? 'Ledger open' : 'No data yet';

  const root = document.getElementById('app-content');
  root.innerHTML = '';

  const banner = renderInstallBanner();
  if(banner) root.appendChild(banner);

  if(state.ui.tab==='dashboard') root.appendChild(renderDashboard());
  else if(state.ui.tab==='collect') root.appendChild(renderCollect());
  else if(state.ui.tab==='tenants') root.appendChild(renderTenants());
  else if(state.ui.tab==='message') root.appendChild(renderMessage());
}

function renderInstallBanner(){
  if(state.ui.bannerDismissed) return null;
  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
  const div = document.createElement('div');
  div.className = 'install-banner';
  div.innerHTML = `<span>📲</span><span><b>Add to Home Screen</b> to use Pankaj Apartments like an app${isIOS ? ': tap the Share icon in Safari, then "Add to Home Screen".' : ' from your browser menu.'}</span><button id="dismissBanner">Got it</button>`;
  div.querySelector('#dismissBanner').onclick = ()=>{ state.ui.bannerDismissed=true; saveState(); render(); };
  return div;
}

function renderDashboard(){
  const wrap = document.createElement('div');
  const month = ensureMonth(state.activeMonth);
  const active = state.tenants.filter(t=>t.active);
  let collected=0, due=0, pendingCount=0;
  const pending = [];
  active.forEach(t=>{
    const rec = month.records[t.id];
    const c = computeRecord(rec, t);
    collected += rec.rentPaid||0;
    due += c.due;
    if(c.due>0){ pendingCount++; pending.push({t, c}); }
  });

  wrap.innerHTML = `
    <div class="stat-grid">
      <div class="stat-card paid"><div class="label">Collected</div><div class="value mono">${fmt(collected)}</div></div>
      <div class="stat-card due"><div class="label">Due</div><div class="value mono">${fmt(due)}</div></div>
      <div class="stat-card"><div class="label">Tenants</div><div class="value mono">${active.length}</div></div>
      <div class="stat-card"><div class="label">Pending</div><div class="value mono">${pendingCount}</div></div>
    </div>
    <div class="section-title">Pending payments <span class="count">${pendingCount} of ${active.length}</span></div>
  `;

  if(pending.length===0){
    const e = document.createElement('div');
    e.className='empty';
    e.textContent = 'Everyone has paid for ' + monthLabel(state.activeMonth) + ' 🎉';
    wrap.appendChild(e);
  } else {
    sortByRoom(pending.map(p=>p.t)).map(t=>pending.find(p=>p.t.id===t.id)).forEach(({t,c})=>{
      const card = document.createElement('div');
      card.className = 'tenant-card';
      card.innerHTML = `
        <div class="row1">
          <div class="who">
            <div class="room">${t.room}</div>
            <div class="name">${t.name}</div>
          </div>
          <span class="status-pill due">${c.isLate?'Late':'Due'}</span>
        </div>
        <div class="totals-row">
          <div class="tlabel">Amount due${c.lateFeeApplied>0?' (incl. late charge)':''}</div>
          <div class="tval due mono">${fmt(c.due)}</div>
        </div>
        <div class="card-actions">
          <button class="btn btn-wa" data-wa="${t.id}" style="${c.isLate?'background:var(--due);':''}">${c.isLate?'WhatsApp Late Notice':'WhatsApp Reminder'}</button>
        </div>
      `;
      card.querySelector('[data-wa]').onclick = ()=>sendWhatsApp(t.id, c.isLate ? 'late' : 'reminder');
      wrap.appendChild(card);
    });
  }
  return wrap;
}

function renderCollect(){
  const wrap = document.createElement('div');
  const month = ensureMonth(state.activeMonth);
  const active = sortByRoom(state.tenants.filter(t=>t.active));

  const summary = document.createElement('div');
  const totalDue = active.reduce((s,t)=>s+computeRecord(month.records[t.id],t).due,0);
  summary.className='month-summary-bar';
  summary.innerHTML = `<span>${active.length} tenants</span><span>Outstanding: <b class="mono">${fmt(totalDue)}</b></span>`;
  wrap.appendChild(summary);

  active.forEach(t=>{
    const rec = month.records[t.id];
    const c = computeRecord(rec, t);
    const card = document.createElement('div');
    card.className = 'tenant-card';
    card.innerHTML = `
      <div class="row1">
        <div class="who">
          <div class="room">${t.room}</div>
          <div class="name">${t.name}</div>
        </div>
        <span class="status-pill ${c.isLate?'due':(c.due>0?'due':'paid')}" id="pill-${t.id}">${c.isLate?'Late':(c.due>0?'Due':'Paid')}</span>
      </div>
      <div class="grid-inputs">
        <div class="field"><label>Meter (Last)</label><input type="number" value="${rec.lastReading}" disabled></div>
        <div class="field"><label>Meter (Current)</label><input type="number" value="${rec.currentReading}" data-f="currentReading" data-t="${t.id}"></div>
        <div class="field"><label>Sweeper (₹)</label><input type="number" value="${rec.sweeper}" data-f="sweeper" data-t="${t.id}"></div>
        <div class="field"><label>Water (₹)</label><input type="number" value="${rec.water}" data-f="water" data-t="${t.id}"></div>
      </div>
      <div class="breakdown">
        <span>Basic: <b class="mono">${fmt(t.basicRent)}</b></span>
        <span>${rec.water>0 ? 'Electricity' : 'Electricity (+ Water)'}: <b class="mono" id="elec-${t.id}">${fmt(c.electricity + (rec.water>0?0:(rec.water||0)))}</b></span>
        ${rec.water>0 ? `<span>Water: <b class="mono">${fmt(rec.water)}</b></span>` : ''}
        <span>Prev. balance: <b class="mono">${fmt(rec.balancePrev)}</b></span>
        ${c.lateFeeApplied>0 ? `<span style="color:var(--due);">Late charge (after ${state.settings.dueDay}th): <b class="mono">${fmt(c.lateFeeApplied)}</b></span>` : ''}
      </div>
      <div class="grid-inputs" style="margin-top:10px;">
        <div class="field" style="grid-column:1/3;"><label>Rent Paid (₹)</label><input type="number" value="${rec.rentPaid||''}" placeholder="0" data-f="rentPaid" data-t="${t.id}"></div>
      </div>
      <div class="totals-row">
        <div>
          <div class="tlabel">Total rent</div>
          <div class="mono" id="total-${t.id}" style="font-size:14px;">${fmt(c.total)}</div>
        </div>
        <div style="text-align:right;">
          <div class="tlabel">${c.due>0?'Balance due':'Status'}</div>
          <div class="tval ${c.due>0?'due':'paid'} mono" id="due-${t.id}">${c.due>0?fmt(c.due):'Paid in full'}</div>
        </div>
      </div>
      <div class="card-actions">
        <button class="btn btn-ghost" data-mark="${t.id}">Mark Paid</button>
        <button class="btn btn-wa" data-wa-r="${t.id}" style="${c.isLate?'background:var(--due);':''}">${c.isLate?'Late Fee Notice':'Remind'}</button>
        <button class="btn btn-wa" data-wa-p="${t.id}" style="background:var(--wa-dark);">Receipt</button>
      </div>
    `;
    card.querySelectorAll('input[data-f]').forEach(inp=>{
      inp.addEventListener('change', ()=> updateField(t.id, inp.dataset.f, inp.value));
    });
    card.querySelector('[data-mark]').onclick = ()=>markPaid(t.id);
    card.querySelector('[data-wa-r]').onclick = ()=>sendWhatsApp(t.id, c.isLate ? 'late' : 'reminder');
    card.querySelector('[data-wa-p]').onclick = ()=>sendWhatsApp(t.id,'receipt');
    wrap.appendChild(card);
  });

  const nextBtn = document.createElement('button');
  nextBtn.className = 'new-month-btn';
  const nextKey = shiftMonth(state.activeMonth, 1);
  nextBtn.textContent = state.months[nextKey] ? 'Go to ' + monthLabel(nextKey) : 'Start ' + monthLabel(nextKey) + ' →';
  nextBtn.onclick = ()=>{ ensureMonth(nextKey); state.activeMonth = nextKey; saveState(); render(); };
  wrap.appendChild(nextBtn);

  return wrap;
}

function renderTenants(){
  const wrap = document.createElement('div');
  wrap.innerHTML = '<div class="section-title">Tenants &amp; Rooms<span class="count">' + state.tenants.length + '</span></div>';

  sortByRoom(state.tenants).forEach(t=>{
    const row = document.createElement('div');
    row.className = 'tenant-row';
    row.innerHTML = `
      <div class="toprow">
        <label class="toggle"><input type="checkbox" ${t.active?'checked':''} data-active="${t.id}"> Active tenant</label>
        <button class="remove-x" data-remove="${t.id}">Remove</button>
      </div>
      <div class="grid-inputs">
        <div class="field"><label>Room</label><input type="text" value="${t.room}" data-tf="room" data-t="${t.id}"></div>
        <div class="field"><label>Name</label><input type="text" value="${t.name}" data-tf="name" data-t="${t.id}"></div>
        <div class="field"><label>Phone (WhatsApp)</label><input type="text" placeholder="+91 9xxxxxxxxx" value="${t.phone}" data-tf="phone" data-t="${t.id}"></div>
        <div class="field"><label>Phone 2 (optional)</label><input type="text" placeholder="+91 9xxxxxxxxx" value="${t.phone2||''}" data-tf="phone2" data-t="${t.id}"></div>
        <div class="field"><label>Basic Rent (₹)</label><input type="number" value="${t.basicRent}" data-tf="basicRent" data-t="${t.id}"></div>
      </div>
    `;
    row.querySelectorAll('input[data-tf]').forEach(inp=>{
      inp.addEventListener('change', ()=>{
        const field = inp.dataset.tf;
        t[field] = field==='basicRent' ? Number(inp.value||0) : inp.value;
        saveState();
      });
    });
    row.querySelector('[data-active]').addEventListener('change', (e)=>{
      t.active = e.target.checked;
      saveState();
    });
    row.querySelector('[data-remove]').onclick = ()=>{
      if(confirm('Remove ' + t.name + ' from tenant list? This does not delete past month records.')){
        state.tenants = state.tenants.filter(x=>x.id!==t.id);
        saveState();
        render();
      }
    };
    wrap.appendChild(row);
  });

  const addBtn = document.createElement('button');
  addBtn.className = 'add-btn';
  addBtn.textContent = '+ Add tenant / room';
  addBtn.onclick = ()=>{
    state.tenants.push({id:uid(), room:'New', name:'New Tenant', phone:'', phone2:'', basicRent:6000, active:true});
    saveState();
    render();
  };
  wrap.appendChild(addBtn);
  return wrap;
}

function renderMessage(){
  const wrap = document.createElement('div');
  const sample = state.tenants.find(t=>t.active) || state.tenants[0];
  const month = ensureMonth(state.activeMonth);

  const settingsBlock = document.createElement('div');
  settingsBlock.className = 'msg-block';
  settingsBlock.innerHTML = `
    <h3>Due Date &amp; Late Charge</h3>
    <p class="hint">Rent is due by this day of the month. After it passes, unpaid tenants are marked "Late" and this late charge is added automatically.</p>
    <div class="grid-inputs">
      <div class="field"><label>Due day of month</label><input type="number" min="1" max="31" id="dueDayInput" value="${state.settings.dueDay}"></div>
      <div class="field"><label>Late charge (₹)</label><input type="number" min="0" id="lateFeeInput" value="${state.settings.lateFeeAmount}"></div>
    </div>
  `;
  settingsBlock.querySelector('#dueDayInput').addEventListener('change', (e)=>{
    state.settings.dueDay = Math.min(31, Math.max(1, Number(e.target.value)||10));
    saveState();
    render();
  });
  settingsBlock.querySelector('#lateFeeInput').addEventListener('change', (e)=>{
    state.settings.lateFeeAmount = Math.max(0, Number(e.target.value)||0);
    saveState();
    render();
  });
  wrap.appendChild(settingsBlock);

  function block(kind, title, hint){
    const div = document.createElement('div');
    div.className = 'msg-block';
    const tpl = state.templates[kind];
    div.innerHTML = `
      <h3>${title}</h3>
      <p class="hint">${hint}</p>
      <textarea id="tpl-${kind}">${tpl}</textarea>
      <div class="placeholders">
        ${['name','room','month','rent','electricity','sweeper','water','balancePrev','total','paid','due','balanceNext','dueDay','lateFeeAmount'].map(p=>`<span class="chip" data-ins="{${p}}">{${p}}</span>`).join('')}
      </div>
      <div class="preview-label">Preview</div>
      <div class="preview" id="prev-${kind}"></div>
    `;
    const ta = div.querySelector('textarea');
    const preview = div.querySelector('.preview');
    function updatePreview(){
      if(!sample){ preview.textContent = 'Add a tenant to see a preview.'; return; }
      const rec = month.records[sample.id] || {currentReading:0,lastReading:0,factor:8,sweeper:0,water:0,balancePrev:0,rentPaid:0};
      const c = computeRecord(rec, sample);
      preview.textContent = fillTemplate(ta.value, sample, rec, c);
    }
    ta.addEventListener('input', ()=>{
      state.templates[kind] = ta.value;
      saveState();
      updatePreview();
    });
    div.querySelectorAll('.chip').forEach(chip=>{
      chip.addEventListener('click', ()=>{
        const pos = ta.selectionStart || ta.value.length;
        ta.value = ta.value.slice(0,pos) + chip.dataset.ins + ta.value.slice(pos);
        state.templates[kind] = ta.value;
        saveState();
        updatePreview();
        ta.focus();
      });
    });
    updatePreview();
    return div;
  }

  wrap.appendChild(block('reminder','Rent Reminder','Sent before the due date, or any time rent is still owed. Tap the chips below to insert a value into your message.'));
  wrap.appendChild(block('late','Late Charge Notice','Appears as the button on a tenant\'s card once they are past the due day and still owe money — includes the late charge.'));
  wrap.appendChild(block('receipt','Payment Receipt','Sent any time to confirm what was paid, e.g. after you tap "Mark Paid".'));
  return wrap;
}

document.querySelectorAll('.tabbar button').forEach(b=>{
  b.addEventListener('click', ()=>switchTab(b.dataset.tab));
});
document.getElementById('prevMonth').addEventListener('click', ()=>{
  const k = shiftMonth(state.activeMonth,-1);
  if(state.months[k]){ state.activeMonth = k; saveState(); render(); }
  else toast('No earlier ledger for that month');
});
document.getElementById('nextMonth').addEventListener('click', ()=>{
  const k = shiftMonth(state.activeMonth,1);
  ensureMonth(k);
  state.activeMonth = k;
  saveState();
  render();
});

loadState();
</script>
</body>
</html>
